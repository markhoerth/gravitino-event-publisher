# Gradle 9.1.0 is the first release that can run on JDK 25.
# Gradle 8.x fails with "Unsupported class file major version 69" and the Gradle team
# closed the request to backport JDK 25 support to 8.x as not-planned.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
